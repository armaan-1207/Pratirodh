services:
  dashboard:
    build: .
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    ports: ["127.0.0.1:8766:8765"]
    env_file: .env
    volumes:
      - ./run_output/review:/app/run_output/pratirodh:ro
    tmpfs: ["/tmp:size=32m,mode=1777"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
